name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the api Docker image
      # There is no Dockerfile at the root. The api's Dockerfile uses the repo root
      # as build context (npm workspaces + the shared package-lock.json), like compose.
      run: docker build . --file apps/api/Dockerfile --tag dhaka-tesla-pool-api:$(date +%s)
